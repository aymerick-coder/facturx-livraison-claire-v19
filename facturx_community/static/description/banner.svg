<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#1e88e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="1050" cy="80" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="300" r="80" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="350" r="60" fill="rgba(255,255,255,0.04)"/>

  <!-- FR flag accent bar -->
  <rect x="0" y="0" width="8" height="400" fill="#0055A4"/>
  <rect x="8" y="0" width="8" height="400" fill="#FFFFFF"/>
  <rect x="16" y="0" width="8" height="400" fill="#EF4135"/>

  <!-- Document icon -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="white" opacity="0.9"/>
    <rect x="0" y="0" width="80" height="25" rx="4" fill="url(#accent)"/>
    <text x="40" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">PDF/A-3</text>
    <rect x="12" y="35" width="56" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="12" y="45" width="40" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="12" y="55" width="50" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="12" y="70" width="56" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="12" y="80" width="30" height="4" rx="2" fill="#e0e0e0"/>
    <!-- XML badge -->
    <rect x="45" y="62" width="38" height="20" rx="3" fill="#4caf50"/>
    <text x="64" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">XML</text>
  </g>

  <!-- Main title -->
  <text x="200" y="140" fill="white" font-family="Arial, sans-serif" font-size="42" font-weight="bold">Factur-X</text>
  <text x="200" y="185" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="24">Electronic Invoicing for France</text>

  <!-- Subtitle -->
  <text x="200" y="230" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="16">Odoo Community 16 | 17 | 18</text>

  <!-- Feature badges -->
  <g transform="translate(200, 260)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
    <text x="65" y="21" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Factur-X PDF/A-3</text>

    <rect x="145" y="0" width="120" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
    <text x="205" y="21" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Chorus Pro</text>

    <rect x="280" y="0" width="140" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
    <text x="350" y="21" text-anchor="middle" fill="white" font-family="Arial" font-size="13">SIRET Validation</text>

    <rect x="435" y="0" width="120" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
    <text x="495" y="21" text-anchor="middle" fill="white" font-family="Arial" font-size="13">EN16931 / CII</text>
  </g>

  <!-- Compliance badge -->
  <g transform="translate(200, 320)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#4caf50"/>
    <text x="140" y="24" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">Conforme obligation 2026-2027</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(1020, 350)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(255,255,255,0.2)"/>
    <text x="50" y="19" text-anchor="middle" fill="white" font-family="Arial" font-size="12">v1.0.0</text>
  </g>
</svg>
